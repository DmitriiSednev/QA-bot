name: CI

on:
  push:
    branches: [dev, main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Syntax check
        run: python -m compileall -q agent config core database

      - name: Lint (critical errors)
        run: ruff check . --select E9,F63,F7,F82
