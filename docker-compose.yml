version: '3.8'

services:
  qa-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qa_bot_app
    # Используем restart: always для автоматического перезапуска при сбоях или перезагрузке хоста
    restart: always
    env_file:
      - .env # Подключаем файл с переменными окружения
    ports:
      # Пробрасываем порт, если бот должен быть доступен снаружи (не нужно для Telegram бота)
      # - \"8000:8000\"
      []
    volumes:
      # Подключаем именованный volume для логов
      - bot_logs:/app/logs
      # Пробрасываем папку shared_data с хоста (ВМ) в контейнер
      - ./shared_data:/app/shared_data
      # Можно подключить папку с кодом для разработки (но не для продакшн образа!):
      # - .:/app
    networks:
      # Определяем сеть, если нужно взаимодействие с другими сервисами (например, БД)
      - bot-network
    depends_on:
      # Указываем зависимости, например, от базы данных, если она тоже в docker-compose
      # - db
      []
  # Пример сервиса базы данных (если используется)
  # db:
  #   image: postgres:15
  #   container_name: qa_bot_db
  #   restart: always
  #   env_file:
  #     - .env
  #   environment:
  #     POSTGRES_DB: ${DB_NAME}
  #     POSTGRES_USER: ${DB_USER}
  #     POSTGRES_PASSWORD: ${DB_PASS}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - bot-network
  #   ports:
  #     # Можно пробросить порт для внешнего доступа к БД (для отладки)
  #     - \"5432:5432\"

  # Определяем именованные volumes
volumes:
  bot_logs:
    # Volume для логов бота
    # postgres_data: # Volume для данных PostgreSQL (если используется)

    # Определяем сети
networks:
  bot-network:
    driver: bridge # Стандартный драйвер сети 
