version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: qa_bot_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx_logs:/var/log/nginx
    networks:
      - bot-network
    depends_on:
      - qa-bot

  qa-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qa_bot_app
    restart: always
    env_file:
      - .env
    ports:
      # Пробрасываем порт, если бот должен быть доступен снаружи (не нужно для Telegram бота)
      # - \"8000:8000\"
      []
    volumes:
      # Подключаем именованный volume для логов
      - bot_logs:/app/logs
      # Пробрасываем папку shared_data с хоста (ВМ) в контейнер
      - ./shared_data:/app/shared_data
      # Можно подключить папку с кодом для разработки (но не для продакшн образа!):
      # - .:/app
    networks:
      - bot-network
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: qa_bot_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bot-network
    ports:
      # Можно пробросить порт для внешнего доступа к БД (для отладки)
      - "5432:5432"

# Определяем именованные volumes
volumes:
  bot_logs: # Volume для логов бота
  postgres_data: # Volume для данных PostgreSQL (если используется)
  nginx_logs:

    # Определяем сети
networks:
  bot-network:
    driver: bridge # Стандартный драйвер сети 
